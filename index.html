<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gopi's Digital Diary</title>
    <style>
        :root {
            --bg-color: #fdfaf6;
            --text-color: #4a4a4a;
            --accent-color: #8b5e3c;
            --card-bg: #ffffff;
            --highlight: #eaddcf;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: var(--accent-color);
            font-weight: 300;
            margin-bottom: 30px;
        }
        .calendar-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-name {
            font-weight: bold;
            font-size: 0.8em;
            color: #aaa;
            padding-bottom: 10px;
        }
        .date-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s;
            font-size: 0.9em;
            border: 1px solid transparent;
        }
        .date-cell:hover {
            background-color: var(--highlight);
        }
        .has-entry {
            background-color: var(--highlight);
            font-weight: bold;
            border: 1px solid var(--accent-color);
        }
        .selected {
            background-color: var(--accent-color) !important;
            color: white !important;
        }
        .entry-view {
            margin-top: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            display: none;
        }
        .entry-date {
            font-size: 1.2em;
            color: var(--accent-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .entry-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .media-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .media-item {
            max-width: 150px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .media-item:hover {
            transform: scale(1.05);
        }
        .audio-player {
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>My Digital Diary</h1>

    <div class="calendar-container">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">❮</button>
            <h3 id="monthYear"></h3>
            <button onclick="changeMonth(1)">❯</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="entry-view" id="entryView">
        <div class="entry-date" id="displayDate"></div>
        <div class="entry-content" id="displayContent"></div>
        <div class="media-container" id="displayMedia"></div>
    </div>

    <script>
        let currentDate = new Date();
        let diaryEntries = [];

        async function fetchEntries() {
            try {
                const response = await fetch('https://api.github.com/repos/gopinath0332-del/digital-diary/contents/diary');
                const data = await response.json();
                if (Array.isArray(data)) {
                    diaryEntries = data.filter(file => file.name.endsWith('.md')).map(file => file.name.replace('.md', ''));
                }
            } catch (e) {
                console.error("Failed to fetch entries", e);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('monthYear');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            title.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.innerText = d;
                grid.appendChild(div);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'date-cell';
                cell.innerText = day;
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (diaryEntries.includes(dateStr)) {
                    cell.classList.add('has-entry');
                }

                cell.onclick = () => showEntry(dateStr);
                grid.appendChild(cell);
            }
        }

        async function showEntry(date) {
            const view = document.getElementById('entryView');
            const contentDiv = document.getElementById('displayContent');
            const dateDiv = document.getElementById('displayDate');
            const mediaDiv = document.getElementById('displayMedia');

            const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/gopinath0332-del/digital-diary/master';

            view.style.display = 'block';
            dateDiv.innerText = date;
            contentDiv.innerText = "Loading entry...";
            mediaDiv.innerHTML = '';

            try {
                const resp = await fetch(`${GITHUB_RAW_BASE}/diary/${date}.md`);
                const text = await resp.text();

                // Parse markdown image lines: ![alt](path)
                const imageRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
                const foundImages = [];
                let match;
                while ((match = imageRegex.exec(text)) !== null) {
                    foundImages.push({ alt: match[1], path: match[2] });
                }

                // Strip image lines from displayed text
                const cleanText = text
                    .split('\n')
                    .filter(line => !/!\[.*?\]\(.*?\)/.test(line))
                    .join('\n')
                    .trim();

                contentDiv.innerText = cleanText;

                // Render images found in the markdown
                foundImages.forEach(({ alt, path }) => {
                    // Paths may be absolute like /diary/images/foo.jpg or relative
                    const src = path.startsWith('http')
                        ? path
                        : `${GITHUB_RAW_BASE}${path.startsWith('/') ? '' : '/'}${path}`;
                    const el = document.createElement('img');
                    el.src = src;
                    el.alt = alt;
                    el.className = 'media-item';
                    el.onerror = () => el.style.display = 'none';
                    mediaDiv.appendChild(el);
                });

            } catch (e) {
                contentDiv.innerText = "Could not load entry.";
            }
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        fetchEntries().then(() => renderCalendar());
    </script>
</body>
</html>
