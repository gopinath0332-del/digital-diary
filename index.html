<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gopi's Digital Diary</title>
    <style>
        :root {
            --bg-color: #fdfaf6;
            --text-color: #4a4a4a;
            --accent-color: #8b5e3c;
            --card-bg: #ffffff;
            --highlight: #eaddcf;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: var(--accent-color);
            font-weight: 300;
            margin-bottom: 30px;
        }
        .calendar-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-name {
            font-weight: bold;
            font-size: 0.8em;
            color: #aaa;
            padding-bottom: 10px;
        }
        .date-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s;
            font-size: 0.9em;
            border: 1px solid transparent;
        }
        .date-cell:hover {
            background-color: var(--highlight);
        }
        .has-entry {
            background-color: var(--highlight);
            font-weight: bold;
            border: 1px solid var(--accent-color);
        }
        .selected {
            background-color: var(--accent-color) !important;
            color: white !important;
        }
        .entry-view {
            margin-top: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            display: none;
        }
        .entry-date {
            font-size: 1.2em;
            color: var(--accent-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .entry-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .media-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .media-item {
            max-width: 150px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .media-item:hover {
            transform: scale(1.05);
        }
        .audio-player {
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>My Digital Diary</h1>

    <div class="calendar-container">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">❮</button>
            <h3 id="monthYear"></h3>
            <button onclick="changeMonth(1)">❯</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="entry-view" id="entryView">
        <div class="entry-date" id="displayDate"></div>
        <div class="entry-content" id="displayContent"></div>
        <div class="media-container" id="displayMedia"></div>
    </div>

    <script>
        let currentDate = new Date();
        let diaryEntries = [];
        let entriesByDate = new Map();

        async function fetchEntries() {
            const GITHUB_API_URL = 'https://api.github.com/repos/gopinath0332-del/digital-diary/contents/diary';
            const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/gopinath0332-del/digital-diary/master/diary';
            const isLocalFile = window.location.protocol === 'file:';
            let filesList = [];
            let jsonEntries = [];

            // 1. Try to get list of files via GitHub API (works with CORS even on file:// protocol)
            try {
                const response = await fetch(GITHUB_API_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        filesList = data.filter(file => file.name.endsWith('.md'));
                    }
                }
            } catch (e) {
                console.warn("Could not fetch entries list from GitHub API", e);
            }

            // 2. Try to fetch entries.json (locally if served, or from GitHub if on file://)
            try {
                const jsonUrl = isLocalFile 
                    ? `${GITHUB_RAW_BASE}/entries.json` 
                    : 'diary/entries.json';
                const response = await fetch(jsonUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        jsonEntries = data;
                    }
                }
            } catch (e) {
                console.warn("Could not fetch entries.json", e);
            }

            // 3. Merge the files and the json metadata entries
            const entriesMap = new Map();

            // First, populate entries found via GitHub API files list
            filesList.forEach(file => {
                const date = file.name.replace('.md', '');
                entriesMap.set(date, {
                    date: date,
                    path: isLocalFile ? `${GITHUB_RAW_BASE}/${file.name}` : `diary/${file.name}`
                });
            });

            // Second, merge entries from entries.json (either locally or retrieved from GitHub)
            jsonEntries.forEach(entry => {
                const existing = entriesMap.get(entry.date);
                if (existing) {
                    entriesMap.set(entry.date, { ...existing, ...entry });
                } else {
                    let path = entry.path;
                    if (!path) {
                        path = isLocalFile 
                            ? `${GITHUB_RAW_BASE}/${entry.date}.md` 
                            : `diary/${entry.date}.md`;
                    } else if (isLocalFile && !path.startsWith('http')) {
                        path = `${GITHUB_RAW_BASE}/${path.replace('diary/', '')}`;
                    }
                    entriesMap.set(entry.date, { ...entry, path });
                }
            });

            diaryEntries = Array.from(entriesMap.keys());
            entriesByDate = entriesMap;
        }


        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('monthYear');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            title.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.innerText = d;
                grid.appendChild(div);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'date-cell';
                cell.innerText = day;
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (diaryEntries.includes(dateStr)) {
                    cell.classList.add('has-entry');
                }

                cell.onclick = () => showEntry(dateStr);
                grid.appendChild(cell);
            }
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderInlineMarkdown(value) {
            return escapeHtml(value)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
                    return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${label}</a>`;
                });
        }

        function renderMarkdown(text) {
            const mediaLine = /^\s*-?\s*!\[[^\]]*\]\([^)]+\)\s*$/;
            const audioLine = /^\s*-?\s*(?:🎧\s*)?\[([^\]]+)\]\(([^)]+\.(?:ogg|mp3|wav|m4a))\)\s*$/i;
            const lines = text
                .split('\n')
                .filter(line => !mediaLine.test(line) && !audioLine.test(line));

            const html = [];
            let inList = false;

            function closeList() {
                if (inList) {
                    html.push('</ul>');
                    inList = false;
                }
            }

            lines.forEach(line => {
                if (!line.trim()) {
                    closeList();
                    return;
                }

                const heading = line.match(/^(#{1,3})\s+(.+)$/);
                if (heading) {
                    closeList();
                    const level = heading[1].length + 1;
                    html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
                    return;
                }

                const listItem = line.match(/^\s*-\s+(.+)$/);
                if (listItem) {
                    if (!inList) {
                        html.push('<ul>');
                        inList = true;
                    }
                    html.push(`<li>${renderInlineMarkdown(listItem[1])}</li>`);
                    return;
                }

                closeList();
                html.push(`<p>${renderInlineMarkdown(line)}</p>`);
            });

            closeList();
            return html.join('');
        }

        function resolveMediaPath(path, entryPath) {
            if (path.startsWith('http')) {
                return path;
            }

            if (path.startsWith('/')) {
                return path.replace(/^\//, '');
            }

            const basePath = entryPath.split('/').slice(0, -1).join('/');
            return `${basePath}/${path.replace(/^\.\//, '')}`;
        }

        function renderMedia(text, entryPath, mediaDiv) {
            const imageRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
            const audioRegex = /\[([^\]]+)\]\(([^)]+\.(?:ogg|mp3|wav|m4a))\)/gi;
            const seen = new Set();
            let match;

            while ((match = imageRegex.exec(text)) !== null) {
                const src = resolveMediaPath(match[2], entryPath);
                if (seen.has(src)) continue;
                seen.add(src);

                const el = document.createElement('img');
                el.src = src;
                el.alt = match[1];
                el.className = 'media-item';
                el.onerror = () => el.style.display = 'none';
                mediaDiv.appendChild(el);
            }

            while ((match = audioRegex.exec(text)) !== null) {
                const src = resolveMediaPath(match[2], entryPath);
                if (seen.has(src)) continue;
                seen.add(src);

                const audio = document.createElement('audio');
                audio.src = src;
                audio.controls = true;
                audio.className = 'audio-player';
                mediaDiv.appendChild(audio);
            }
        }

        async function showEntry(date) {
            const view = document.getElementById('entryView');
            const contentDiv = document.getElementById('displayContent');
            const dateDiv = document.getElementById('displayDate');
            const mediaDiv = document.getElementById('displayMedia');
            const entry = entriesByDate.get(date);

            view.style.display = 'block';
            dateDiv.innerText = date;
            mediaDiv.innerHTML = '';

            if (!entry) {
                contentDiv.innerText = "No entry for this date.";
                return;
            }

            contentDiv.innerText = "Loading entry...";

            try {
                const resp = await fetch(entry.path);
                if (!resp.ok) {
                    throw new Error(`Entry not found: ${entry.path}`);
                }
                const text = await resp.text();
                contentDiv.innerHTML = renderMarkdown(text);
                renderMedia(text, entry.path, mediaDiv);

            } catch (e) {
                contentDiv.innerText = "Could not load entry.";
            }
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        fetchEntries().then(() => renderCalendar());
    </script>
</body>
</html>
